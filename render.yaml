services:
  - type: web
    name: booklet
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Server reads process.env.PORT; match the Dockerfile's EXPOSE 7860 so
      # Render routes to the right port. BROWSER_PATH / DISABLE_HTTPS come from
      # the Dockerfile ENV and don't need repeating here.
      - key: PORT
        value: 7860
